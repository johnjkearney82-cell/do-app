var st = null;

function load() {
  try {
    var s = localStorage.getItem(SK);
    if (s) {
      var parsed = JSON.parse(s);
      if (parsed && parsed.cal && parsed.lists) {
        st = parsed;
        return;
      }
    }
  } catch(e) {
    console.warn('localStorage load failed:', e);
  }
  reset();
}

function reset() {
  st = {
    cal: JSON.parse(JSON.stringify(SEED.calTodos)),
    lists: JSON.parse(JSON.stringify(SEED.listSets)),
    wo: 0
  };
  save();
}

function save() {
  try { localStorage.setItem(SK, JSON.stringify(st)); } catch(e) { console.warn('save failed', e); }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function dk(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function wdates(off) {
  var now = new Date();
  var mon = new Date(now);
  mon.setDate(now.getDate() - now.getDay() + 1 + off * 7);
  var r = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon);
    d.setDate(mon.getDate() + i);
    r.push(d);
  }
  return r;
}

function go(tab) {
  document.getElementById('tw').className = 'tab' + (tab==='week' ? ' on' : '');
  document.getElementById('tl').className = 'tab' + (tab==='lists' ? ' on' : '');
  document.getElementById('wv').style.display = tab==='week' ? '' : 'none';
  document.getElementById('lv').style.display = tab==='lists' ? '' : 'none';
  if (tab==='lists') rl();
}

function rw() {
  var dates = wdates(st.wo || 0);
  var tk = dk(new Date());
  var d0 = dates[0];
  var d6 = dates[6];
  var wl = d0.getDate()+' '+MN[d0.getMonth()]+' – '+d6.getDate()+' '+MN[d6.getMonth()]+' '+d6.getFullYear();
  var cols = '';
  for (var x = 0; x < 7; x++) {
    var d = dates[x];
    var k = dk(d);
    var items = st.cal[k] || [];
    var rows = '';
    for (var i = 0; i < items.length; i++) {
      var t = items[i];
      rows += '<div class="item'+(t.done?' done':'')+'" onclick="tc(''+k+'','+i+')">'
            + '<div class="chk">'+(t.done?'&#10003;':'')+'</div>'
            + '<div class="txt">'+esc(t.text)+'</div>'
            + '</div>';
    }
    cols += '<div class="dcol'+(k===tk?' today':'')+'">'
          + '<div class="dname">'+DN[d.getDay()]+'</div>'
          + '<div class="dnum">'+d.getDate()+'</div>'
          + rows
          + '<input class="ainput" placeholder="+ add" onkeydown="ac(event,''+k+'')" />'
          + '</div>';
  }
  document.getElementById('wv').innerHTML =
    '<div class="wnav">'
    + '<button class="abtn" onclick="cw(-1)">&#8249;</button>'
    + '<span class="wlabel">'+wl+'</span>'
    + '<button class="abtn" onclick="cw(1)">&#8250;</button>'
    + '<button class="tbtn" onclick="gt()">Today</button>'
    + '</div>'
    + '<div class="wgrid">'+cols+'</div>';
}

function cw(d) { st.wo = (st.wo||0)+d; rw(); }
function gt() { st.wo = 0; rw(); }

function tc(k, i) {
  if (!st.cal[k]) return;
  st.cal[k][i].done = !st.cal[k][i].done;
  save(); rw();
}

function ac(e, k) {
  if (e.key !== 'Enter') return;
  var v = e.target.value.trim();
  if (!v) return;
  if (!st.cal[k]) st.cal[k] = [];
  st.cal[k].push({ id: ''+Date.now(), text: v, done: false, pos: st.cal[k].length });
  save(); rw();
}

function rl() {
  var html = '';
  for (var gi = 0; gi < st.lists.length; gi++) {
    var ls = st.lists[gi];
    var all = [];
    for (var li = 0; li < ls.lists.length; li++) {
      all = all.concat(ls.lists[li].todos);
    }
    var undone = all.filter(function(t){ return !t.done; }).length;
    var bdg = undone > 0 ? '<span class="bdg">'+undone+'</span>' : '';
    var inner = '';
    for (var li2 = 0; li2 < ls.lists.length; li2++) {
      var l = ls.lists[li2];
      if (ls.lists.length > 1) inner += '<div class="sublbl">'+esc(l.name)+'</div>';
      for (var ti = 0; ti < l.todos.length; ti++) {
        var t = l.todos[ti];
        inner += '<div class="item'+(t.done?' done':'')+'" onclick="tli('+gi+','+li2+','+ti+')">'
               + '<div class="chk">'+(t.done?'&#10003;':'')+'</div>'
               + '<div class="txt">'+esc(t.text)+'</div>'
               + '</div>';
      }
      inner += '<input class="ainput" placeholder="+ add" onkeydown="alt2(event,'+gi+','+li2+')" />';
    }
    html += '<div class="lcard">'
          + '<div class="lhead"><span class="lname">'+esc(ls.name)+'</span>'
          + '<div class="acts">'+bdg+'<button class="dbtn" onclick="dl('+gi+')" title="delete">&times;</button></div></div>'
          + inner
          + '</div>';
  }
  html += '<button class="addcard" onclick="sal()">+ New list</button>';
  document.getElementById('lv').innerHTML =
    '<div class="slabel">Category lists</div>'
    + '<div class="lgrid">'+html+'</div>'
    + '<input id="nli" placeholder="List name…" onkeydown="cal2(event)" />';
}

function tli(gi, li, ti) {
  st.lists[gi].lists[li].todos[ti].done = !st.lists[gi].lists[li].todos[ti].done;
  save(); rl();
}

function alt2(e, gi, li) {
  if (e.key !== 'Enter') return;
  var v = e.target.value.trim();
  if (!v) return;
  var lst = st.lists[gi].lists[li];
  lst.todos.push({ id: ''+Date.now(), text: v, done: false, pos: lst.todos.length });
  save(); rl();
}

function dl(gi) {
  if (!confirm('Delete "'+st.lists[gi].name+'"?')) return;
  st.lists.splice(gi, 1); save(); rl();
}

function sal() {
  var el = document.getElementById('nli');
  el.style.display = 'block'; el.focus();
}

function cal2(e) {
  if (e.key !== 'Enter') return;
  var v = e.target.value.trim();
  if (!v) return;
  var id = ''+Date.now();
  st.lists.push({ id: id, name: v, lists: [{ id: id+'l', name: v, todos: [] }] });
  save(); rl();
}

load();
rw();
</script>
